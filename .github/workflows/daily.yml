name: 每日AI新闻推送

on:
  schedule:
    # GitHub 的 cron 使用 UTC 时间；北京时间 = UTC + 8
    # 北京 06:30 = UTC 22:30（前一天）
    - cron: '30 22 * * *'
  # 允许在网页上手动触发，方便测试
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: 运行推送脚本
        env:
          # 邮件主通道（必填）
          MAIL_TO: ${{ secrets.MAIL_TO }}                # 收件邮箱
          SMTP_USER: ${{ secrets.SMTP_USER }}            # 发信 QQ 邮箱
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}  # QQ 邮箱 SMTP 授权码
          # 微信兜底通道（邮件失败时使用，必填）
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 分类 + 总结（必填，缺失时自动降级为规则分类）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # GitHub 自动提供，用于提高 API 调用限额（无需手动配置）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
