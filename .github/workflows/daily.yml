name: 每日AI新闻推送

on:
  schedule:
    # GitHub 的 cron 使用 UTC 时间；北京时间 = UTC + 8
    # 北京 08:00 = UTC 00:00
    - cron: '0 0 * * *'
  # 允许在网页上手动触发，方便测试
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: 运行推送脚本
        env:
          # 从 GitHub Secrets 读取，Token 不会出现在代码或日志里
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 可选：配置后自动生成 AI 今日导读；不配置则自动跳过
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py
